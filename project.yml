name: HaispaceRuntime

options:
  bundleIdPrefix: id.haispaceproject
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_BITCODE: NO

targets:
  HaispaceRuntime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HaispaceRuntime
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.haispaceproject.runtime
        PRODUCT_NAME: HaiBooth
        INFOPLIST_FILE: HaispaceRuntime/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        DEBUG_INFORMATION_FORMAT: dwarf
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: PassKit.framework
      - sdk: MessageUI.framework
      - sdk: BackgroundTasks.framework
      - sdk: CoreNFC.framework
        weak: true
      - sdk: CoreImage.framework
      - sdk: UIKit.framework

  HaispaceRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HaispaceRuntimeTests
    dependencies:
      - target: HaispaceRuntime
    settings:
      base:
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  HaispaceRuntime:
    build:
      targets:
        HaispaceRuntime: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaispaceRuntimeTests
    analyze:
      config: Debug
    archive:
      config: Release
