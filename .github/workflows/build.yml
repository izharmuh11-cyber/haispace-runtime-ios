name: M-004 The First Heartbeat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iPad Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project HaispaceRuntime.xcodeproj \
            -scheme HaispaceRuntime \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HSP_API_BASE_URL="https://api.haispaceproject.my.id" \
            HSP_MIDTRANS_CLIENT_KEY="ci-placeholder" \
            HSP_LICENSE_KEY="ci-placeholder" > build.log 2>&1 || {
              echo "=== BUILD ERRORS ==="
              grep "error:" build.log
              echo "===================="
              exit 1
            }

      - name: Build Succeeded
        run: echo "haispace-runtime-ios ALIVE"
